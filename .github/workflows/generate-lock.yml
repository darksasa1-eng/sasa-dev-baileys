name: Generate package-lock.json

on:
  workflow_dispatch:  # අතින් trigger කිරීමට
  # push:
  #   branches: [main]   # අවශ්‍ය නම් ස්වයංක්‍රීයවද ක්‍රියාත්මක කළ හැක

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # repo එකට commit කිරීමට අවසර
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install   # lock file create කරයි
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate package-lock.json" || echo "No changes to commit"
          git push

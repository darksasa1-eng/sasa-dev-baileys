name: Generate package-lock.json

on:
  workflow_dispatch:  # 👈 Actions tab එකෙන් manually run කිරීමට

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # repo එකට commit/push කිරීමට අවශ්‍ය අවසරය
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # GitHub auto-token

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and generate lock file
        run: npm install

      - name: Commit and push package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "chore: add package-lock.json"
          git push
